{% extends 'base.html' %}

{% block content %}
{% load crispy_forms_tags %}

<div class="row">
    <!-- Left sidebar -->
    <!-- load sidebar.html -->
    {% include 'dashboard/sidebar.html' %}

    <!-- right sidebar -->
    <div class="col-md-9">
        {% if perms.auth.add_user %}
        <h2>Add New User</h2>
        <form action="{% url 'add_user' %}" method="post">
            {% csrf_token %}

            {{ form | crispy }}
            <button type="submit" class="btn btn-warning">Submit</button>
        </form>
        {% else %}
        <h5>You do not have to permission to see this page</h5>
        {% endif %}

    </div>
</div>

{% endblock %}
