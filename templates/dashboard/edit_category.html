{% extends 'base.html' %}

{% block content %}
{% load crispy_forms_tags %}

<div class="row">
    <!-- Left sidebar -->
    <!-- load sidebar.html -->
    {% include 'dashboard/sidebar.html' %}

    <!-- right sidebar -->
    <div class="col-md-9">
        <h2>Add New Category</h2>
        <form action="{% url 'edit_category' category.id %}" method="post" style="width:500px">
            {% csrf_token %}

            {{ form | crispy }}
            <button type="submit" class="btn btn-warning">Submit</button>
        </form>

    </div>
</div>

{% endblock %}
